<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#4cc3ff">
<title>Steal an Egg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10213a; --sky1:#3fb6ff; --sky2:#bdeaff; --grass1:#5fd34a; --grass2:#2f9e2c;
  --yellow:#ffd23f; --orange:#ff9a1f; --green:#35d45a; --green-d:#13892f;
  --blue:#2f8bff; --blue-d:#1556b8; --red:#ff4b4b; --red-d:#b41f1f; --purple:#a35bff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0d1b2e;color:#fff;font-family:'Fredoka',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{display:flex;align-items:center;justify-content:center}
.chunky{font-family:'Lilita One','Fredoka',system-ui,sans-serif;letter-spacing:.01em;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}

/* phone frame */
.phone{position:relative;width:100vw;height:100dvh;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--sky1) 0%,#7fd2ff 35%,var(--sky2) 56%)}
@media (min-width:500px){
  body{background:radial-gradient(900px 600px at 30% 20%,#1d3c66,#0b1424 70%)}
  .phone{width:390px;height:844px;border-radius:54px;box-shadow:0 0 0 11px #1a1a1a,0 0 0 13px #2c2c2c,0 40px 120px rgba(0,0,0,.7)}
  .phone::before{content:"";position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:80}
}

/* ---------- world ---------- */
.world{position:absolute;inset:-24px;z-index:0;pointer-events:none;overflow:hidden;filter:blur(5px) saturate(1.1);transform:scale(1.03)}
.sun{position:absolute;top:70px;right:-30px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,#fff9c4 0 38%,#ffe066 39% 55%,rgba(255,224,102,0) 72%)}
.cloud{position:absolute;height:26px;background:#fff;border-radius:6px;box-shadow:0 5px 0 rgba(16,33,58,.08);animation:cloud linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:6px}
.cloud::before{width:44%;height:26px;left:16%;top:-17px}
.cloud::after{width:30%;height:20px;left:52%;top:-11px}
@keyframes cloud{from{transform:translateX(-160px)}to{transform:translateX(560px)}}

.hills{position:absolute;left:0;right:0;top:51%;height:70px}
.hill{position:absolute;bottom:0;background:#4fbf47;border:3px solid var(--ink);border-bottom:none;border-radius:10px 10px 0 0}
.tree{position:absolute;bottom:0;width:34px}
.tree i{display:block;margin:0 auto;width:10px;height:18px;background:#8a5a2b;border:2px solid var(--ink);border-top:none}
.tree b{display:block;width:34px;height:34px;background:#2fa344;border:3px solid var(--ink);border-radius:6px;box-shadow:inset -6px -6px 0 rgba(0,0,0,.15)}
.ground{position:absolute;left:-30%;right:-30%;top:58%;bottom:-10%;background:
  repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0 2px,transparent 2px 46px),
  repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 2px,transparent 2px 46px),
  linear-gradient(180deg,var(--grass1),var(--grass2));
  transform:perspective(300px) rotateX(38deg);transform-origin:top;border-top:4px solid var(--ink)}
.fence{position:absolute;left:0;right:0;top:calc(58% - 22px);height:24px;background:
  repeating-linear-gradient(90deg,#e0a35a 0 10px,transparent 10px 34px);border-bottom:6px solid #c47f37}
#sparkles{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}

/* ---------- HUD ---------- */
.status{position:relative;z-index:5;height:50px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 4px;font-weight:700;font-size:15px;color:var(--ink)}
.status .icons{display:flex;gap:6px;align-items:center}

.logo{position:relative;z-index:5;flex:none;text-align:center;margin-top:6px;line-height:.9;transform:rotate(-3deg)}
.logo .a{font-size:46px;color:var(--yellow)}
.logo .b{display:inline-block;margin-top:4px;font-size:15px;color:#fff;background:var(--purple);border:3px solid var(--ink);border-radius:10px;padding:3px 10px 4px;box-shadow:0 4px 0 var(--ink);-webkit-text-stroke:0;text-shadow:0 2px 0 rgba(0,0,0,.3)}

.speed{position:relative;z-index:5;flex:none;margin:14px auto 0;display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,#fff,#dff3ff);border:4px solid var(--ink);border-radius:18px;padding:4px 18px 6px 10px;box-shadow:0 5px 0 var(--ink)}
.speed .ico{width:52px;height:auto;margin:-6px 0 -6px -4px;filter:drop-shadow(0 2px 0 rgba(16,33,58,.35))}
.speed{cursor:pointer}
.speed .n{font-family:'Lilita One',sans-serif;font-size:31px;color:var(--orange);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;font-variant-numeric:tabular-nums;line-height:1}
.speed .l{font-family:'Lilita One',sans-serif;font-size:18px;color:var(--ink);margin-top:6px}
.speed.bump{animation:bump .14s ease-out}
@keyframes bump{50%{transform:scale(1.07)}}

/* middle area */
.mid{position:relative;z-index:5;flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.side{position:absolute;left:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px}
.sbtn{position:relative;width:64px;height:64px;border-radius:16px;border:4px solid var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#fff;font:inherit;font-family:'Lilita One',sans-serif;font-size:11.5px;line-height:1;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;box-shadow:0 5px 0 var(--ink),inset 0 -6px 0 rgba(0,0,0,.18),inset 0 4px 0 rgba(255,255,255,.35);transition:transform .08s}
.sbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink),inset 0 -6px 0 rgba(0,0,0,.18)}
.sbtn svg{width:30px;height:30px;-webkit-text-stroke:0}
.sbtn.g{background:var(--green)} .sbtn.b{background:var(--blue)} .sbtn.o{background:var(--orange)}
.sbtn .badge{position:absolute;top:-10px;right:-12px;background:var(--red);border:3px solid var(--ink);border-radius:10px;padding:1px 5px 2px;font-size:11px;-webkit-text-stroke:2px var(--ink)}

.eggwrap{position:relative;width:220px;height:250px;display:flex;align-items:flex-end;justify-content:center}
.rays{position:absolute;left:50%;top:45%;width:420px;height:420px;margin:-210px 0 0 -210px;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(255,240,150,.75) 0 9deg,transparent 9deg 24deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 60%);mask:radial-gradient(circle,#000 0,transparent 60%);animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rarity{position:absolute;top:-8px;left:50%;transform:translateX(-50%) rotate(-2deg);white-space:nowrap;font-size:17px;z-index:3;
  background:linear-gradient(90deg,#ff5a5a,#ffcb3d,#4be36b,#3fb6ff,#b46bff,#ff5a5a);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:0;text-shadow:none;animation:rainbow 2.4s linear infinite;filter:drop-shadow(0 0 0 var(--ink)) drop-shadow(2px 0 0 var(--ink)) drop-shadow(-2px 0 0 var(--ink)) drop-shadow(0 2px 0 var(--ink)) drop-shadow(0 -2px 0 var(--ink)) drop-shadow(0 4px 0 var(--ink))}
@keyframes rainbow{to{background-position:300% 0}}
.egg{position:relative;z-index:2;width:170px;height:212px;border:none;background:none;cursor:pointer;margin-bottom:26px;filter:drop-shadow(0 0 22px rgba(255,236,120,.9))}
.egg svg{width:100%;height:100%;overflow:visible}
.egg.tm,.egg.tm:not(.hit){animation:none}
.egg.tm{transform-origin:50% 100%}
.egg.tm.hit{animation:jump .5s linear}
@keyframes jump{0%{transform:translateY(0) scale(1,1)}12%{transform:translateY(0) scale(1.08,.86)}32%{transform:translateY(-44px) scale(.94,1.08) rotate(-5deg)}50%{transform:translateY(-52px) scale(1,1) rotate(4deg)}70%{transform:translateY(0) scale(1.1,.88) rotate(0)}84%{transform:translateY(-10px) scale(.97,1.03)}100%{transform:translateY(0) scale(1,1)}}
.runner{cursor:pointer}
.egg.tm{width:300px;height:auto;margin-bottom:0;filter:drop-shadow(0 0 18px rgba(90,220,255,.9)) drop-shadow(0 0 30px rgba(255,220,90,.55))}
.egg.tm img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
.eggwrap.tmw{width:300px;height:310px;align-items:center}
.eggwrap.tmw .rarity{top:-6px}
.float img{width:34px;height:auto;vertical-align:middle;margin-left:3px}
.egg.hit{animation:wob .4s ease-out}
@keyframes flash{0%{filter:brightness(1.9) saturate(1.3)}100%{filter:brightness(1)}}
@keyframes wob{0%{transform:scale(1)}35%{transform:scale(.9,1.06) rotate(-4deg)}70%{transform:scale(1.05,.95) rotate(3deg)}100%{transform:scale(1)}}
.egg:not(.hit){animation:idle 2.6s ease-in-out infinite}
@keyframes idle{50%{transform:translateY(-6px) rotate(2deg)}}
.pedestal{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:190px;height:44px;z-index:1}
.combo{position:absolute;right:14px;top:20%;font-size:20px;color:#fff;background:var(--red);border:4px solid var(--ink);border-radius:14px;padding:3px 10px 5px;transform:rotate(8deg) scale(.6);opacity:0;transition:.15s;-webkit-text-stroke:3px var(--ink);box-shadow:0 4px 0 var(--ink)}
.combo.on{opacity:1;transform:rotate(8deg) scale(1)}

.float{position:absolute;z-index:20;pointer-events:none;font-family:'Lilita One',sans-serif;font-size:32px;color:#ffe11a;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;animation:up 1.8s cubic-bezier(.15,.8,.3,1) forwards;white-space:nowrap;filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 14px #ffb800)}
.float.x{color:#22e8ff;filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 16px #00b4ff)}
.burst{position:absolute;z-index:19;pointer-events:none;width:140px;height:140px;margin:-70px 0 0 -70px;border-radius:50%;background:radial-gradient(circle,#fff 0 14%,rgba(255,230,60,.95) 26%,rgba(255,170,0,.6) 44%,rgba(255,170,0,0) 66%);border:5px solid #ffe11a;box-shadow:0 0 0 3px var(--ink),0 0 24px 6px #ffb800,inset 0 0 18px #fff;animation:burst 1s ease-out forwards}
@keyframes burst{0%{transform:scale(.2);opacity:1}60%{opacity:.8}100%{transform:scale(2.3);opacity:0}}
@keyframes up{0%{opacity:1;transform:translate(-50%,0) scale(.6)}15%{transform:translate(-50%,-20px) scale(1.35)}75%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-190px) scale(1)}}

/* treadmill */
.track{position:relative;z-index:5;flex:none;height:132px;display:flex;align-items:flex-end;justify-content:center}
.mill{position:relative;width:260px;height:120px}
.console{position:absolute;right:16px;top:0;width:58px;height:70px}
.console .scr{position:absolute;left:8px;top:6px;width:42px;height:22px;background:#0f2b1a;border:3px solid var(--ink);border-radius:6px;color:#5bff88;font:700 11px/16px 'Fredoka',monospace;text-align:center}
.console .post{position:absolute;left:24px;top:28px;width:10px;height:62px;background:#7c8a9e;border:3px solid var(--ink)}
.belt{position:absolute;left:0;right:0;bottom:12px;height:24px;border:4px solid var(--ink);border-radius:14px;background:repeating-linear-gradient(90deg,#3a4250 0 16px,#252b35 16px 32px);box-shadow:0 6px 0 #7c8a9e,0 10px 0 var(--ink)}
.runner{position:absolute;left:84px;bottom:32px;width:70px;height:96px}
.runner svg{width:100%;height:100%;overflow:visible}
.shadow{position:absolute;left:92px;bottom:30px;width:56px;height:8px;border-radius:50%;background:rgba(0,0,0,.35)}
.wind{position:absolute;left:10px;bottom:56px;width:70px;height:40px;opacity:var(--wind,0);transition:opacity .2s}
.wind i{position:absolute;height:4px;border-radius:2px;background:#fff;animation:wind .35s linear infinite}
@keyframes wind{from{transform:translateX(30px);opacity:1}to{transform:translateX(-40px);opacity:0}}

/* bottom */
.bottom{position:relative;z-index:5;flex:none;padding:10px 18px calc(18px + env(safe-area-inset-bottom))}
.goal .lbl{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-family:'Lilita One',sans-serif;font-size:15px;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.bar{position:relative;height:26px;border:4px solid var(--ink);border-radius:13px;background:#1c2b42;overflow:hidden;box-shadow:0 4px 0 var(--ink)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(180deg,#7dff8f,#22c447);box-shadow:inset 0 5px 0 rgba(255,255,255,.35);transition:width .15s}
.hint{margin-top:12px;text-align:center;font-family:'Lilita One',sans-serif;font-size:17px;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;animation:hint 1.2s ease-in-out infinite}
@keyframes hint{50%{transform:scale(1.06)}}

/* ---------- panels ---------- */
.modal{position:absolute;inset:0;z-index:40;background:rgba(10,20,40,.55);display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal.open{opacity:1;pointer-events:auto}
.panel{position:relative;width:100%;border:5px solid var(--ink);border-radius:26px;text-align:center;box-shadow:0 8px 0 var(--ink),0 0 50px rgba(255,236,120,.65),0 0 110px rgba(80,190,255,.6);transform:scale(.6);transition:transform .4s cubic-bezier(.2,1.6,.4,1)}
.modal.open .panel{transform:scale(1)}
.panel .in{position:relative;overflow:hidden;border-radius:20px;padding:46px 20px 22px;background:radial-gradient(120% 70% at 50% 0%,#8fe0ff 0%,#3fa8ff 45%,#1f6fe0 100%);box-shadow:inset 0 0 0 4px rgba(255,255,255,.45)}
.panel canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.panel .prays{position:absolute;left:50%;top:96px;width:560px;height:560px;margin:-280px 0 0 -280px;pointer-events:none;opacity:.6;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.55) 0 8deg,transparent 8deg 22deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 60%);mask:radial-gradient(circle,#000 0,transparent 60%);animation:spin 12s linear infinite}
.panel .ttl{position:absolute;top:-24px;left:50%;transform:translateX(-50%);z-index:3;white-space:nowrap;font-size:24px;color:#fff;background:var(--orange);border:5px solid var(--ink);border-radius:16px;padding:4px 18px 7px;box-shadow:0 5px 0 var(--ink);-webkit-text-stroke:4px var(--ink)}
.panel .x{position:absolute;top:-14px;right:-14px;z-index:4;width:44px;height:44px;border-radius:12px;background:var(--red);border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink);color:#fff;font:26px/1 'Lilita One',sans-serif;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;cursor:pointer}
.panel .big{position:relative;width:150px;height:auto;margin:0 auto;filter:drop-shadow(0 0 20px rgba(255,240,140,1));animation:idle 2.2s ease-in-out infinite}
.panel h3{position:relative;font-size:28px;color:var(--yellow);margin:10px 0 6px;line-height:1.05}
.panel p{position:relative;font-weight:600;font-size:15px;line-height:1.45;color:#fff;text-shadow:0 2px 0 rgba(16,33,58,.6)}
.panel p b{color:var(--yellow)}
.panel ol{position:relative;text-align:left;font-weight:600;font-size:15px;line-height:1.55;padding-left:20px;margin-top:4px;text-shadow:0 2px 0 rgba(16,33,58,.6)}
.prog{position:relative;height:24px;margin-top:16px;border:4px solid var(--ink);border-radius:12px;background:#1c2b42;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(180deg,#ffe680,#ffb21f);box-shadow:inset 0 5px 0 rgba(255,255,255,.4);transition:width .45s}
.step{position:relative;margin-top:10px;min-height:22px;font-family:'Lilita One',sans-serif;font-size:16px;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.btn{position:relative;display:block;width:100%;margin-top:14px;border:4px solid var(--ink);border-radius:16px;padding:12px;cursor:pointer;color:#fff;font-family:'Lilita One',sans-serif;font-size:21px;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;box-shadow:0 6px 0 var(--ink),inset 0 -7px 0 rgba(0,0,0,.18),inset 0 5px 0 rgba(255,255,255,.35);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink),inset 0 -7px 0 rgba(0,0,0,.18)}
.btn.g{background:var(--green)} .btn.y{background:var(--orange)} .btn.gray{background:#8796ab;font-size:17px;padding:9px}
.btn.claim{font-size:28px;padding:14px;background:linear-gradient(180deg,#5cff7d,#1fc94a);animation:claim 1s ease-in-out infinite}
@keyframes claim{50%{transform:scale(1.06);box-shadow:0 6px 0 var(--ink),0 0 40px rgba(80,255,120,.9),inset 0 -7px 0 rgba(0,0,0,.18),inset 0 5px 0 rgba(255,255,255,.35)}}

.ad{position:absolute;inset:0;z-index:50;background:#0d1b2e;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.ad.open{display:flex}
.ad .n{font-size:80px;color:var(--yellow)}
.ad .s{font-family:'Lilita One',sans-serif;font-size:18px;color:#fff}

.reveal{position:absolute;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:radial-gradient(circle at 50% 35%,#ffe680 0,#ff9a1f 45%,#ff4b4b 100%)}
.reveal.open{display:flex;animation:shake .45s steps(3) 2}
@keyframes shake{25%{transform:translate(-6px,3px) rotate(-1deg)}50%{transform:translate(6px,-3px) rotate(1deg)}75%{transform:translate(-3px,-2px)}}
.reveal .emoji{font-size:100px;line-height:1;filter:drop-shadow(0 6px 0 var(--ink))}
.reveal h1{font-size:56px;line-height:.95;color:#fff;margin-top:14px;transform:rotate(-3deg)}
.reveal p{margin-top:16px;font-weight:700;font-size:17px;line-height:1.45;color:#fff;text-shadow:0 2px 0 rgba(16,33,58,.7)}
.reveal .stat{margin-top:20px;background:#fff;border:4px solid var(--ink);border-radius:18px;padding:10px 26px 12px;box-shadow:0 5px 0 var(--ink);color:var(--ink);font-weight:700}
.reveal .stat b{display:block;font-family:'Lilita One',sans-serif;font-size:40px;color:var(--orange);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill}
.reveal .btn{max-width:280px}

.toast{position:absolute;bottom:200px;left:50%;z-index:90;transform:translate(-50%,20px);white-space:nowrap;background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:7px 14px;font-family:'Lilita One',sans-serif;font-size:16px;opacity:0;transition:.25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="phone" id="phone">

  <!-- world -->
  <div class="world" aria-hidden="true">
    <div class="sun"></div>
    <div class="cloud" style="top:96px;width:110px;animation-duration:38s;animation-delay:-6s"></div>
    <div class="cloud" style="top:170px;width:80px;animation-duration:30s;animation-delay:-20s"></div>
    <div class="cloud" style="top:250px;width:120px;animation-duration:46s;animation-delay:-33s"></div>
    <div class="cloud" style="top:320px;width:70px;animation-duration:34s;animation-delay:-12s"></div>
    <div class="hills">
      <div class="hill" style="left:-20px;width:150px;height:46px"></div>
      <div class="hill" style="left:220px;width:200px;height:60px;background:#45b23f"></div>
      <div class="tree" style="left:40px"><b></b><i></i></div>
      <div class="tree" style="left:300px;transform:scale(1.2);transform-origin:bottom"><b></b><i></i></div>
      <div class="tree" style="left:345px;transform:scale(.85);transform-origin:bottom"><b></b><i></i></div>
    </div>
    <div class="ground"></div>
    <div class="fence"></div>
  </div>
  <canvas id="sparkles"></canvas>

  <div class="status">
    <span id="clock">9:41</span>
    <span class="icons">

    <h1 class="chunky">YOU GOT<br>PRANKED!</h1>
    <p>None of this speed is real. You just tapped a picture of a treadmill for nothing.</p>
    <div class="stat">Taps wasted<b id="wasted">0</b></div>
    <button class="btn g" id="again">TAP AGAIN ANYWAY</button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const GOAL = 1000, MIN_EX = 500;
  let speed = 0, taps = 0, lastTap = 0, streak = 0, tempo = 0;
  const fmt = n => n.toLocaleString('en-US');
  const short = n => { const u=[[1e15,'Q'],[1e12,'T'],[1e9,'B'],[1e6,'M'],[1e3,'K']]; for (const [v,s] of u) if (n >= v) return (+(n/v).toFixed(n/v < 10 ? 1 : 0)) + s; return String(n); };
  const PER_TAP = 1000000;
  const SHOES = document.querySelector('.speed .ico').src;

  const clock = () => { const d = new Date(); $('clock').textContent = (d.getHours() % 12 || 12) + ':' + String(d.getMinutes()).padStart(2,'0'); };
  clock(); setInterval(clock, 10000);

  function render(){
    $('count').textContent = short(speed);
    $('scr').textContent = short(speed);
    const s = $('speedBox'); s.classList.remove('bump'); void s.offsetWidth; s.classList.add('bump');
  }
  function toast(msg){
    const t = $('toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 1900);
  }
  function spawn(x, y, amt){
    const zone = $('zone'), r = zone.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'float' + (amt > PER_TAP ? ' x' : '');
    el.style.left = (x - r.left) + 'px';
    el.style.top = (y - r.top - 24) + 'px';
    el.style.setProperty('--dx', (Math.random() * 90 - 45) + 'px');
    el.innerHTML = '+' + short(amt) + '<img src="' + SHOES + '" alt="">';
    zone.appendChild(el);
    setTimeout(() => el.remove(), 1800);
  }

  // runner: smooth, frame-by-frame running; faster tapping = faster running
  const phone = $('phone');
  const parts = { body: document.querySelector('.runner .body'), lA: document.querySelector('.runner .lA'), lB: document.querySelector('.runner .lB'), aA: document.querySelector('.runner .aA'), aB: document.querySelector('.runner .aB') };
  const belt = $('belt'), shadow = $('shadow');
  let phase = 0, smooth = 0, beltX = 0, lastT = performance.now();
  function setTempo(){}  // kept for callers; animation reads `tempo` directly
  function run(t){
    const dt = Math.min(0.05, (t - lastT) / 1000); lastT = t;
    tempo = Math.max(0, tempo - dt * 2.2);                 // gentle slow-down when tapping stops
    smooth += (tempo - smooth) * Math.min(1, dt * 3.5);    // ease toward target speed
    const k = Math.min(1, smooth / 12);                     // 0 = jog, 1 = full sprint
    const freq = 1.15 + k * 2.6;                            // strides per second
    phase += dt * freq * Math.PI * 2;
    const s = Math.sin(phase);
    const legAmp = 26 + k * 16, armAmp = 30 + k * 20;
    const lean = 3 + k * 9;
    const bob = -Math.abs(Math.cos(phase)) * (2.5 + k * 3);
    parts.body.setAttribute('transform', 'translate(0 ' + bob.toFixed(2) + ') rotate(' + lean.toFixed(2) + ' 35 90)');
    parts.lA.setAttribute('transform', 'rotate(' + (s * legAmp).toFixed(2) + ' 30 62)');
    parts.lB.setAttribute('transform', 'rotate(' + (-s * legAmp).toFixed(2) + ' 40 62)');
    parts.aB.setAttribute('transform', 'rotate(' + (s * armAmp).toFixed(2) + ' 23 33)');
    parts.aA.setAttribute('transform', 'rotate(' + (-s * armAmp).toFixed(2) + ' 45 33)');
    shadow.style.transform = 'scaleX(' + (1 + bob / 20).toFixed(3) + ')';
    beltX -= dt * (40 + k * 230);
    belt.style.backgroundPosition = (beltX % 32).toFixed(1) + 'px 0';
    phone.style.setProperty('--wind', Math.max(0, (k - 0.25) / 0.6).toFixed(2));
    requestAnimationFrame(run);
  }
  requestAnimationFrame(run);

  function hit(x, y){
    const now = performance.now();
    streak = (now - lastTap < 260) ? streak + 1 : 0;
    lastTap = now;
    tempo = Math.min(14, tempo + 1.2);
    let mult = streak > 25 ? 3 : streak > 10 ? 2 : 1;
    const combo = $('combo');
    if (mult > 1){ combo.textContent = 'x' + mult + '!'; combo.classList.add('on'); } else combo.classList.remove('on');
    speed += mult * PER_TAP; taps++;
    spawn(x, y, mult * PER_TAP);
    render();
    const egg = $('tap'); egg.classList.remove('hit'); void egg.offsetWidth; egg.classList.add('hit');
    if (navigator.vibrate) try { navigator.vibrate(8); } catch(e){}
    checkGoal();
  }

  const tap = $('tap');
  tap.addEventListener('pointerdown', e => { e.preventDefault(); hit(e.clientX, e.clientY); });
  tap.addEventListener('animationend', e => { if (e.animationName === 'wob' || e.animationName === 'jump') tap.classList.remove('hit'); });

  // secret: tapping the Speed counter quietly adds 1,000 speed
  $('speedBox').addEventListener('pointerdown', e => {
    e.preventDefault();
    speed += 1000000000; render();
    const r = tap.getBoundingClientRect();
    spawn(r.left + r.width / 2, r.top + r.height / 3, 1000000000);
    tempo = 14; setTempo();
    checkGoal();
  });

  // tapping the runner gives +1 billion speed
  $('runner').addEventListener('pointerdown', e => {
    e.preventDefault();
    speed += 1000000000; taps++; render();
    spawn(e.clientX, e.clientY - 20, 1000000000);
    tempo = 14; setTempo();
    if (navigator.vibrate) try { navigator.vibrate(15); } catch(e){}
  });

  // Redeem window opens by itself at 1,000 speed
  function checkGoal(){
    // popup at 1,000 speed turned off
  }
  function openRedeem(){
    $('exProgWrap').style.display = 'none'; $('exStep').textContent = '';
    $('exGo').style.display = ''; $('claimBtn').style.display = 'none';
    $('exTitle').textContent = 'Redeem ' + fmt(speed) + ' Speed';
    $('exText').textContent = 'You reached the goal! Your Speed will be sent to your game instantly.';
    $('exModal').classList.add('open');
  }

  $('exGo').onclick = () => {
    $('exGo').style.display = 'none';
    $('exProgWrap').style.display = ''; const bar = $('exProg'); bar.style.width = '0';
    const steps = ['Joining server…','Checking ' + fmt(speed) + ' Speed…','Checking for exploits…','Sending Speed to your game…','Almost done…'];
    let i = 0;
    const tick = () => {
      if (i < steps.length){
        $('exStep').textContent = steps[i];
        bar.style.width = ((i + 1) / steps.length * 100) + '%';
        i++; setTimeout(tick, 900 + Math.random() * 600);
      } else {
        $('exTitle').textContent = 'CONGRATULATIONS!';
        $('exText').innerHTML = '🎉 You got <b>' + fmt(speed) + ' Speed</b>!<br>Tap below to add it to your game.';
        $('exProgWrap').style.display = 'none'; $('exStep').textContent = '';
        $('claimBtn').style.display = '';
        if (navigator.vibrate) try { navigator.vibrate([40,30,40]); } catch(e){}
      }
    };
    tick();
  };

  $('claimBtn').onclick = () => {
    $('exModal').classList.remove('open');
    $('wasted').textContent = fmt(taps);
    $('reveal').classList.add('open');
    if (navigator.vibrate) try { navigator.vibrate([60,40,60]); } catch(e){}
  };
  $('again').onclick = () => {
    $('reveal').classList.remove('open');
    speed = 0; taps = 0; hit.done = false; render();
  };

  // sparkle engine
  function sparkles(canvas, count, opts = {}){
    const ctx = canvas.getContext('2d');
    const cols = opts.colors || ['#ffffff','#fff3a0','#ffd23f','#ffffff'];
    let W = 0, H = 0, parts = [];
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const mk = anyY => ({
      x: Math.random() * W, y: anyY ? Math.random() * H : H + 10,
      r: Math.random() * (opts.max || 3) + 0.8, c: cols[Math.random() * cols.length | 0],
      vy: -(Math.random() * (opts.speed || 0.25) + 0.05), vx: (Math.random() - .5) * 0.15,
      ph: Math.random() * Math.PI * 2, sp: Math.random() * 0.05 + 0.02
    });
    function size(){
      W = canvas.offsetWidth; H = canvas.offsetHeight;
      canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
      parts = Array.from({length: count}, () => mk(true));
    }
    function frame(){
      ctx.clearRect(0,0,W,H);
      for (const p of parts){
        p.x += p.vx; p.y += p.vy; p.ph += p.sp;
        if (p.y < -10) Object.assign(p, mk(false));
        const a = Math.max(0, Math.sin(p.ph)) * 0.9 + 0.1, s = p.r * 3 * (0.6 + a * 0.6);
        ctx.save(); ctx.translate(p.x, p.y); ctx.globalAlpha = a; ctx.fillStyle = p.c;
        ctx.shadowColor = p.c; ctx.shadowBlur = 10; ctx.beginPath();
        ctx.moveTo(0,-s); ctx.quadraticCurveTo(0,0,s,0); ctx.quadraticCurveTo(0,0,0,s);
        ctx.quadraticCurveTo(0,0,-s,0); ctx.quadraticCurveTo(0,0,0,-s); ctx.fill(); ctx.restore();
      }
      requestAnimationFrame(frame);
    }
    if (window.ResizeObserver) new ResizeObserver(size).observe(canvas); else window.addEventListener('resize', size);
    size(); frame();
  }
  sparkles($('sparkles'), 45);
  sparkles($('panelSparkles'), 45, { max: 3.6, speed: 0.4, colors:['#ffffff','#fff3a0','#ffd23f','#7dff8f','#ffffff'] });

  render();
})();
</script>
</body>
</html>
